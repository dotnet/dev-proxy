name: .NET

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore: ['samples/**', '**.md', '.vscode/**', '**.svg']
  pull_request:
    # The branches below must be a subset of the branches above
    paths-ignore: ['samples/**', '**.md', '.vscode/**', '**.svg']
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Job names are used as required status checks in the repository ruleset and
# must stay in sync with .github/workflows/dotnet-required-workaround.yml.
jobs:
  # Fast gate: compile with warnings as errors and run unit tests on Linux
  # before spending Windows/macOS runners on the full matrix.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x
    - name: Cache NuGet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/Directory.Build.props') }}
        restore-keys: nuget-${{ runner.os }}-
    - name: Restore dependencies
      run: dotnet restore DevProxy.sln --locked-mode
    - name: Build
      run: dotnet build DevProxy.sln --no-restore -warnaserror
    - name: Unit tests
      run: |
        dotnet test DevProxy.Abstractions.Tests/DevProxy.Abstractions.Tests.csproj --no-build --blame-hang-timeout 5m --results-directory TestResults --logger "trx;LogFileName=abstractions.trx"
        dotnet test DevProxy.Proxy.Kestrel.Tests/DevProxy.Proxy.Kestrel.Tests.csproj --no-build --blame-hang-timeout 5m --results-directory TestResults --logger "trx;LogFileName=proxy-kestrel.trx"
        dotnet test DevProxy.Tests/DevProxy.Tests.csproj --no-build --blame-hang-timeout 5m --results-directory TestResults --logger "trx;LogFileName=devproxy.trx"
    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: build-test-results
        path: TestResults
        if-no-files-found: ignore
        retention-days: 7

  # Build artifacts are OS-specific (apphost, native assets), so each OS builds
  # once and runs all test suites against that build.
  tests:
    name: Tests (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x
    - name: Cache NuGet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/Directory.Build.props') }}
        restore-keys: nuget-${{ runner.os }}-
    - name: Restore dependencies
      run: dotnet restore DevProxy.sln --locked-mode
    # Process smoke tests launch the DevProxy host, so build the whole solution.
    - name: Build
      run: dotnet build DevProxy.sln --no-restore
    - name: Test DevProxy.Abstractions.Tests
      run: dotnet test DevProxy.Abstractions.Tests/DevProxy.Abstractions.Tests.csproj --no-build --blame-hang-timeout 5m --results-directory TestResults --logger "trx;LogFileName=abstractions.trx"
    - name: Test DevProxy.Proxy.Kestrel.Tests
      run: dotnet test DevProxy.Proxy.Kestrel.Tests/DevProxy.Proxy.Kestrel.Tests.csproj --no-build --blame-hang-timeout 5m --results-directory TestResults --logger "trx;LogFileName=proxy-kestrel.trx"
    - name: Test DevProxy.Tests
      run: dotnet test DevProxy.Tests/DevProxy.Tests.csproj --no-build --blame-hang-timeout 5m --results-directory TestResults --logger "trx;LogFileName=devproxy.trx"
    - name: Test DevProxy.Integration.Tests
      run: dotnet test DevProxy.Integration.Tests/DevProxy.Integration.Tests.csproj --no-build --blame-hang-timeout 5m --results-directory TestResults --logger "trx;LogFileName=integration.trx"
    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-results-${{ matrix.os }}
        path: TestResults
        if-no-files-found: ignore
        retention-days: 7
