name: Schemas

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    # labeled/unlabeled re-run the check when the schema-fix bypass label changes
    types: [ opened, synchronize, reopened, labeled, unlabeled ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  released-schemas-unchanged:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # PR merge commit and its first parent (the base branch)
        fetch-depth: 2
    - name: Check that schemas of released versions are unchanged
      env:
        BYPASS: ${{ contains(github.event.pull_request.labels.*.name, 'schema-fix') }}
      run: |
        args=(shipped --base HEAD^1 --head HEAD)
        if [ "$BYPASS" = "true" ]; then args+=(--bypass); fi
        python3 .github/scripts/check-schemas.py "${args[@]}"

  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: python -m pip install --disable-pip-version-check 'jsonschema[format-nongpl]==4.25.1' PyYAML==6.0.2
    - name: Validate schemas and JSON/YAML files that reference them
      run: python .github/scripts/check-schemas.py validate
