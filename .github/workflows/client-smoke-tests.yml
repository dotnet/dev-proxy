name: Client smoke tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore: ['samples/**', '**.md', '.vscode/**', '**.svg', 'schemas/**', 'features/**']
  pull_request:
    paths-ignore: ['samples/**', '**.md', '.vscode/**', '**.svg', 'schemas/**', 'features/**']

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 11.0.x
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.22.3
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    - name: Install Python client dependencies
      run: python -m pip install -r tests/clients/python/requirements.txt
    - name: Restore dependencies
      run: |
        dotnet restore DevProxy/DevProxy.csproj --locked-mode
        dotnet restore DevProxy.Plugins/DevProxy.Plugins.csproj --locked-mode
    - name: Build Dev Proxy
      run: |
        dotnet build DevProxy/DevProxy.csproj -c Release --no-restore
        dotnet build DevProxy.Plugins/DevProxy.Plugins.csproj -c Release --no-restore
    - name: Run client smoke tests
      env:
        DEVPROXY: ${{ github.workspace }}/DevProxy/bin/Release/net11.0/devproxy
      run: tests/clients/run.sh
