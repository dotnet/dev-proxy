name: .NET # name must match the original workflow

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: ['samples/**', '**.md', '.vscode/**', '**.svg'] # must be the exact opposite of the original workflow
  pull_request:
    paths: ['samples/**', '**.md', '.vscode/**', '**.svg']

# https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/defining-the-mergeability-of-pull-requests/troubleshooting-required-status-checks#handling-skipped-but-required-checks

permissions:
  contents: read

jobs: # job names and matrices must match the original workflow
  build:
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "No build required"'

  unit-tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - run: 'echo "No unit tests required"'

  integration-tests:
    name: Integration tests (${{ matrix.os }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - run: 'echo "No integration tests required"'
