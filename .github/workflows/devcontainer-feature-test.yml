name: Dev Container Feature - Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'features/**', '.github/workflows/devcontainer-feature-test.yml' ]
  pull_request:
    paths: [ 'features/**', '.github/workflows/devcontainer-feature-test.yml' ]

permissions:
  contents: read

env:
  DEVCONTAINER_CLI_VERSION: 0.89.0

jobs:
  test-autogenerated:
    name: Test on ${{ matrix.baseImage }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-latest, ubuntu-24.04-arm ]
        baseImage:
          - debian:latest
          - ubuntu:latest
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Dev Container CLI
        run: npm install -g @devcontainers/cli@${{ env.DEVCONTAINER_CLI_VERSION }}
      - name: Test the Feature with default options, installed once and twice
        working-directory: features
        shell: bash
        env:
          BASE_IMAGE: ${{ matrix.baseImage }}
        run: |
          status=0
          devcontainer features test --skip-scenarios -f dev-proxy -i "$BASE_IMAGE" . 2>&1 | tee "$RUNNER_TEMP/features-test.log" || status=$?
          # The CLI prints one "Passed: '<name>'" summary line per test: the default options and the duplicate install.
          passed=$(grep -cE "Passed:[[:space:]]+'" "$RUNNER_TEMP/features-test.log" || true)
          echo "Passed tests: $passed (expected 2)"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if [ "$passed" -ne 2 ]; then
            echo "::error::Expected 2 passing tests, got $passed"
            exit 1
          fi

  test-scenarios:
    name: Test scenarios (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-latest, ubuntu-24.04-arm ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Dev Container CLI
        run: npm install -g @devcontainers/cli@${{ env.DEVCONTAINER_CLI_VERSION }}
      - name: Test the Feature scenarios
        working-directory: features
        shell: bash
        run: |
          scenarios=$(jq -r 'keys[]' test/dev-proxy/scenarios.json)
          expected=$(printf '%s' "$scenarios" | grep -c . || true)
          echo "Scenarios in test/dev-proxy/scenarios.json: $expected"
          if [ "$expected" -eq 0 ]; then
            echo "::error::test/dev-proxy/scenarios.json defines no scenarios"
            exit 1
          fi
          for scenario in $scenarios; do
            if [ ! -f "test/dev-proxy/$scenario.sh" ]; then
              echo "::error::Scenario '$scenario' has no test script test/dev-proxy/$scenario.sh"
              exit 1
            fi
          done
          status=0
          devcontainer features test -f dev-proxy --skip-autogenerated --skip-duplicated . 2>&1 | tee "$RUNNER_TEMP/features-test.log" || status=$?
          # The CLI prints one "Passed: '<name>'" summary line per scenario.
          passed=$(grep -cE "Passed:[[:space:]]+'" "$RUNNER_TEMP/features-test.log" || true)
          echo "Passed scenarios: $passed of $expected"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if [ "$passed" -ne "$expected" ]; then
            echo "::error::Expected $expected passing scenarios, got $passed"
            exit 1
          fi

  validate:
    name: Validate the Feature metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate devcontainer-feature.json
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          validate-only: 'true'
          base-path-to-features: ./features/src
